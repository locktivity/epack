name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests (core)
        run: go test -race -v ./...

      # Only the packages whose build differs under the tag; the core run has
      # covered the rest.
      - name: Run tests (components)
        run: |
          pkgs="$(./scripts/components-packages.sh)"
          # shellcheck disable=SC2086
          go test -race -v -tags components $pkgs

  # The conformance harness builds only with its tag, so nothing above
  # compiles or tests it.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build (conformance)
        run: go build -tags conformance -o epack-conformance ./cmd/epack-conformance

      - name: Run tests (conformance)
        run: go test -race -v -tags conformance ./internal/componentconf/...

  # Windows covers the core build only: the components build depends on
  # internal/execsafe, which has no Windows implementation yet.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests (core)
        run: go test ./...

      - name: Build (core)
        run: go build -o epack.exe ./cmd/epack

      - name: Verify binary runs
        run: .\epack.exe version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint (core)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          skip-cache: true

      - name: golangci-lint (components)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags components
          skip-cache: true

      - name: Verify import boundary
        run: make lint-boundary

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: govulncheck (core)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: govulncheck (components)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags components ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: core
            tags: ""
          - name: full
            tags: components
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build (${{ matrix.name }})
        run: |
          if [ -n "${{ matrix.tags }}" ]; then
            go build -tags ${{ matrix.tags }} ./cmd/epack
          else
            go build ./cmd/epack
          fi

      - name: Verify binary runs
        run: ./epack version
