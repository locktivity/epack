name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests (core)
        run: go test -race -v ./...

      - name: Run tests (full)
        run: go test -race -v -tags components ./...

  # Windows covers the core build only: the components build depends on
  # internal/execsafe, which has no Windows implementation yet.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests (core)
        run: go test ./...

      - name: Build (core)
        run: go build -o epack.exe ./cmd/epack

      - name: Verify binary runs
        run: .\epack.exe version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint (core)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.9.0

      - name: golangci-lint (components)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.9.0
          args: --build-tags components

      - name: Verify import boundary
        run: make lint-boundary

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: core
            tags: ""
          - name: full
            tags: components
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build (${{ matrix.name }})
        run: |
          if [ -n "${{ matrix.tags }}" ]; then
            go build -tags ${{ matrix.tags }} ./cmd/epack
          else
            go build ./cmd/epack
          fi

      - name: Verify binary runs
        run: ./epack version

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run fuzz tests (brief)
        run: ./scripts/fuzz.sh 10s
